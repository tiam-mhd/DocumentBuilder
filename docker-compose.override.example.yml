# Optional local override — copy to docker-compose.override.yml (gitignored).
# Use when host port 5432 is already taken by another Postgres.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Then point apps/api/.env DATABASE_URL at 127.0.0.1:5434.

services:
  postgres:
    ports:
      - "5434:5432"

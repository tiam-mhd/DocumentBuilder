  /billing/catalog:
    get:
      tags: [billing]
      summary: List plans and sellable modules
      operationId: getBillingCatalog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BillingCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /businesses/{businessId}/billing/checkout:
    post:
      tags: [billing]
      summary: Start SAAS checkout (plan + modules)
      operationId: startBillingCheckout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutBody'
      responses:
        '200':
          description: Checkout session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CheckoutSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /billing/payments/callback:
    get:
      tags: [billing]
      summary: Gateway return URL (verifies + redirects to web)
      operationId: paymentGatewayCallback
      parameters:
        - name: paymentId
          in: query
          schema:
            type: string
        - name: Authority
          in: query
          schema:
            type: string
        - name: Status
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to web billing return page
  /billing/webhooks/payment:
    post:
      tags: [billing]
      summary: Idempotent payment webhook
      operationId: paymentWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Authority:
                  type: string
                gatewayRef:
                  type: string
                paymentId:
                  type: string
                Status:
                  type: string
      responses:
        '200':
          description: Payment + subscription after activation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      payment:
                        $ref: '#/components/schemas/PublicPayment'
                      subscription:
                        $ref: '#/components/schemas/PublicSubscription'
  /billing/payments/confirm:
    post:
      tags: [billing]
      summary: Confirm payment after return (membership required)
      operationId: confirmPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentBody'
      responses:
        '200':
          description: Payment + subscription
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      payment:
                        $ref: '#/components/schemas/PublicPayment'
                      subscription:
                        $ref: '#/components/schemas/PublicSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Phase 01-T02 — mobile OTP JWT access token
  parameters:
    businessId:
      name: businessId
      in: path
      required: true
      schema:
        type: string
      description: Tenant business id (membership required)
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: AUTH_REQUIRED
          description: |
            Identity codes include MOBILE_INVALID, OTP_COOLDOWN, OTP_RATE_LIMITED,
            OTP_INVALID, OTP_EXPIRED, REDIS_UNAVAILABLE, AUTH_REQUIRED, AUTH_INVALID
        message:
          type: string
          description: Fallback message; clients prefer i18n via code
    RequestOtpBody:
      type: object
      required: [mobile]
      properties:
        mobile:
          type: string
          example: '09121234567'
    VerifyOtpBody:
      type: object
      required: [mobile, code]
      properties:
        mobile:
          type: string
          example: '09121234567'
        code:
          type: string
          pattern: '^\d{6}$'
          example: '123456'
    RequestOtpResult:
      type: object
      required: [mobile, expiresInSeconds, cooldownSeconds]
      properties:
        mobile:
          type: string
          example: '+989121234567'
        expiresInSeconds:
          type: integer
        cooldownSeconds:
          type: integer
        devCode:
          type: string
          description: Present only when SMS_PROVIDER=fake and NODE_ENV=development
    PublicUser:
      type: object
      required: [id, mobile, trialConsumed, createdAt]
      properties:
        id:
          type: string
        mobile:
          type: string
        trialConsumed:
          type: boolean
        createdAt:
          type: string
          format: date-time
    PublicBusiness:
      type: object
      required: [id, name, role, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicSubscription:
      type: object
      required:
        [
          id,
          businessId,
          planId,
          planCode,
          status,
          effectiveStatus,
          writable,
          startsAt,
          endsAt,
        ]
      properties:
        id:
          type: string
        businessId:
          type: string
        planId:
          type: string
          nullable: true
        planCode:
          type: string
          nullable: true
          example: plan.core
        status:
          type: string
          enum: [trial, active, grace, expired, pending_payment]
        effectiveStatus:
          type: string
          enum: [trial, active, grace, expired, pending_payment]
        writable:
          type: boolean
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
    BillingCatalog:
      type: object
      required: [plans, modules]
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PublicPlan'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/PublicCatalogModule'
    PublicPlan:
      type: object
      required:
        [
          id,
          code,
          nameKey,
          descriptionKey,
          priceMonthly,
          currency,
          baseEntitlements,
          moduleCodes,
        ]
      properties:
        id:
          type: string
        code:
          type: string
          example: plan.core
        nameKey:
          type: string
        descriptionKey:
          type: string
        priceMonthly:
          type: integer
        currency:
          type: string
        baseEntitlements:
          type: array
          items:
            type: string
        moduleCodes:
          type: array
          items:
            type: string
    PublicCatalogModule:
      type: object
      required:
        [id, code, nameKey, descriptionKey, priceMonthly, currency]
      properties:
        id:
          type: string
        code:
          type: string
          example: module.map
        nameKey:
          type: string
        descriptionKey:
          type: string
        priceMonthly:
          type: integer
        currency:
          type: string
    VerifyOtpResult:
      type: object
      required: [user, isNewUser, accessToken, tokenType, expiresInSeconds]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        isNewUser:
          type: boolean
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresInSeconds:
          type: integer
    HealthReport:
      type: object
      required: [status, edition, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        edition:
          type: string
          enum: [SELF_HOSTED, SAAS]
        checks:
          type: object
          required: [postgres, redis, mongo]
          properties:
            postgres:
              type: string
              enum: [up, down]
            redis:
              type: string
              enum: [up, down]
            mongo:
              type: string
              enum: [up, down]
    PublicSystemConfig:
      type: object
      required:
        [
          edition,
          publicSignup,
          showPoweredBy,
          trialEnabledByDefault,
          platformCheckout,
          licenseActivation,
          licenseActive,
        ]
      properties:
        edition:
          type: string
          enum: [SELF_HOSTED, SAAS]
        publicSignup:
          type: boolean
        showPoweredBy:
          type: boolean
        trialEnabledByDefault:
          type: boolean
        platformCheckout:
          type: boolean
          description: True only when APP_EDITION=SAAS
        licenseActivation:
          type: boolean
          description: True when APP_EDITION=SELF_HOSTED
        licenseActive:
          type: boolean
          description: SAAS always true; SELF_HOSTED from installation_licenses
    PublicInstallationLicense:
      type: object
      required:
        [required, active, organizationName, keyHint, activatedAt, expiresAt]
      properties:
        required:
          type: boolean
        active:
          type: boolean
        organizationName:
          type: string
          nullable: true
        keyHint:
          type: string
          nullable: true
        activatedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    ActivateLicenseBody:
      type: object
      required: [licenseKey]
      properties:
        licenseKey:
          type: string
        organizationName:
          type: string
    PublicMediaAsset:
      type: object
      required:
        [
          id,
          businessId,
          originalName,
          mimeType,
          byteSize,
          width,
          height,
          status,
          createdAt,
          urls,
        ]
      properties:
        id:
          type: string
        businessId:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        byteSize:
          type: integer
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        urls:
          type: object
          required: [original, thumb, web, print]
          properties:
            original:
              type: string
            thumb:
              type: string
              nullable: true
            web:
              type: string
              nullable: true
            print:
              type: string
              nullable: true
    PublicMediaList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicMediaAsset'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    PublicFontFace:
      type: object
      required:
        [
          id,
          businessId,
          family,
          weight,
          style,
          originalName,
          mimeType,
          extension,
          byteSize,
          storageKey,
          fileUrl,
          createdAt,
        ]
      properties:
        id:
          type: string
        businessId:
          type: string
        family:
          type: string
        weight:
          type: integer
          enum: [100, 200, 300, 400, 500, 600, 700, 800, 900]
        style:
          type: string
          enum: [normal, italic]
        originalName:
          type: string
        mimeType:
          type: string
        extension:
          type: string
          enum: [woff2, ttf, otf]
        byteSize:
          type: integer
        storageKey:
          type: string
          description: ObjectStorage key — `{businessId}/fonts/{fontId}/original.{ext}`
        fileUrl:
          type: string
          description: API path to stream binary (auth required)
        createdAt:
          type: string
          format: date-time
    PublicFontList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicFontFace'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    DesignThemeTokens:
      type: object
      required: [colors, typography, fonts]
      properties:
        colors:
          type: object
          required: [primary, secondary, text, background]
          properties:
            primary:
              type: string
              example: '#1B4D3E'
            secondary:
              type: string
            text:
              type: string
            background:
              type: string
        typography:
          type: object
          required:
            [
              headingFamily,
              bodyFamily,
              headingWeight,
              bodyWeight,
              baseSizePx,
            ]
          properties:
            headingFamily:
              type: string
            bodyFamily:
              type: string
            headingWeight:
              type: integer
            bodyWeight:
              type: integer
            baseSizePx:
              type: integer
              minimum: 10
              maximum: 32
        fonts:
          type: object
          required: [headingFontFaceId, bodyFontFaceId]
          properties:
            headingFontFaceId:
              type: string
              nullable: true
            bodyFontFaceId:
              type: string
              nullable: true
    PublicDesignTheme:
      type: object
      required:
        [id, businessId, name, isDefault, tokens, createdAt, updatedAt]
      properties:
        id:
          type: string
        businessId:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
        tokens:
          $ref: '#/components/schemas/DesignThemeTokens'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicDesignThemeList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicDesignTheme'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CreateDesignThemeBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tokens:
          $ref: '#/components/schemas/DesignThemeTokens'
        makeDefault:
          type: boolean
    UpdateDesignThemeBody:
      type: object
      properties:
        name:
          type: string
        tokens:
          $ref: '#/components/schemas/DesignThemeTokens'
    PublicBlockRegistryEntry:
      type: object
      required: [type, labelKey, allowsChildren, moduleCode]
      properties:
        type:
          type: string
          enum: [text, image, section, divider, headerSlot, footerSlot]
        labelKey:
          type: string
        allowsChildren:
          type: boolean
        moduleCode:
          type: string
          nullable: true
    PublicBlockRegistry:
      type: object
      required: [schemaVersion, items]
      properties:
        schemaVersion:
          type: integer
          example: 3
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicBlockRegistryEntry'
    PublicDocumentTemplate:
      type: object
      required:
        [id, businessId, themeId, name, description, createdAt, updatedAt]
      properties:
        id:
          type: string
        businessId:
          type: string
        themeId:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicDocumentTemplateDetail:
      allOf:
        - $ref: '#/components/schemas/PublicDocumentTemplate'
        - type: object

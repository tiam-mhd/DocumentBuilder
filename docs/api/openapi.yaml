        Worker renders canonical HTML (masters + theme + embedded fonts) → PDF.
        Never runs on editor keystrokes. Requires entitlement `export.pdf`.
        Document status must be `approved` or `published` (ADR 021); otherwise
        `DOCUMENT_NOT_APPROVED_FOR_EXPORT`.
        Cost controls (ADR 033): Redis rate limit per business (`EXPORT_RATE_*` →
        `EXPORT_RATE_LIMITED`) and in-flight cap `queued`+`processing`
        (`EXPORT_MAX_CONCURRENT_PER_BUSINESS` → `EXPORT_TOO_MANY_CONCURRENT`).
      operationId: createPdfExport
      security:
        - bearerAuth: []

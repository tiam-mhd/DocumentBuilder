      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      responses:
        '200':
          description: Allowed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '403':
          $ref: '#/components/responses/EntitlementDenied'
  /businesses/{businessId}/gates/module-org-chart:
    post:
      tags: [content]
      summary: Probe mutate route (module.org_chart)
      operationId: gateProbeModuleOrgChart
      security:

      responses:
        '200':
          description: Created business
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicBusiness'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /businesses/{businessId}:
    parameters:
      - $ref: '#/components/parameters/businessId'
    get:
      tags: [businesses]

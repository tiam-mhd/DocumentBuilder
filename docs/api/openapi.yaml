  /auth/otp/request:
    post:
      tags: [auth]
      summary: Request mobile OTP
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpBody'
      responses:
        '200':
          description: Challenge created (raw OTP never logged; optional devCode only in fake+development)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RequestOtpResult'
        '400':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify OTP, upsert user, issue access JWT
      description: |
        Creates User on first success and returns a Bearer access token.
        No refresh token in MVP — client re-runs OTP when access expires.
        Logout blacklists token `jti` in Redis until expiry.
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpBody'
      responses:
        '200':
          description: User verified with access token
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/VerifyOtpResult'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
  /auth/me:
    get:

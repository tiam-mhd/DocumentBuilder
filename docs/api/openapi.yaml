      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicDocumentTemplate'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CreateDocumentTemplateBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        themeId:
          type: string
          nullable: true

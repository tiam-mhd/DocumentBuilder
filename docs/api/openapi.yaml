  /billing/catalog:
    get:
      tags: [billing]
      summary: List plans and sellable modules
      operationId: getBillingCatalog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BillingCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /businesses/{businessId}/billing/checkout:
    post:
      tags: [billing]
      summary: Start SAAS checkout (plan + modules)
      operationId: startBillingCheckout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:

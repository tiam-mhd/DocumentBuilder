openapi: 3.0.3
info:
  title: Visual Document Builder API
  version: 0.2.0
  description: |
    Canonical file — keep in sync with Nest routes.
    JWT issuance after OTP verify lands in P01-T02.
servers:
  - url: http://localhost:3001/api
    description: Local development
tags:
  - name: system
    description: Health and public edition config
  - name: auth
    description: Mobile OTP identity
  - name: businesses
    description: Multi-business tenancy
  - name: billing
    description: Subscription status and payments
  - name: content
    description: Business content (gate probes until Phase 02 entities)
  - name: assets
    description: Media library and fonts
  - name: design
    description: Document brand themes (not app chrome dark/light)
  - name: documents
    description: Document instances (PG metadata + Mongo body)
  - name: export
    description: PDF export jobs (BullMQ + ObjectStorage)
paths:
  /health:
    get:
      tags: [system]
      summary: Liveness + soft dependency checks
      operationId: getHealth
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthReport'
  /system/config:
    get:
      tags: [system]
      summary: Public edition flags (no secrets)
      operationId: getSystemConfig
      responses:
        '200':
          description: Public system config
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicSystemConfig'
  /system/license:
    get:
      tags: [system]
      summary: Installation license status (no secrets)
      operationId: getInstallationLicense
      responses:
        '200':
          description: License status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicInstallationLicense'
  /system/license/activate:
    post:
      tags: [system]
      summary: Activate SELF_HOSTED installation license
      operationId: activateInstallationLicense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateLicenseBody'
      responses:
        '200':
          description: Activated status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicInstallationLicense'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/media:
    get:
      tags: [assets]
      summary: List media assets
      operationId: listMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 24
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicMediaList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /businesses/{businessId}/media/upload:
    post:
      tags: [assets]
      summary: Upload image (writable + EntitlementGuard)
      operationId: uploadMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Created asset
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicMediaAsset'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
  /businesses/{businessId}/media/{assetId}:
    get:
      tags: [assets]
      summary: Get media metadata
      operationId: getMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicMediaAsset'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      tags: [assets]
      summary: Soft-delete media
      operationId: deleteMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/media/{assetId}/file:
    get:
      tags: [assets]
      summary: Stream media variant
      operationId: getMediaFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: variant
          in: query
          schema:
            type: string
            enum: [original, thumb, web, print]
            default: original
      responses:
        '200':
          description: Binary image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/fonts:
    get:
      tags: [assets]
      summary: List font faces for a business
      description: |
        Paginated list of uploaded font faces (family/weight/style).
        Use for theme/template pickers. Soft-deleted faces are omitted.
      operationId: listFonts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: q
          in: query
          description: Search family or original filename
          schema:
            type: string
      responses:
        '200':
          description: Font list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicFontList'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/fonts/upload:
    post:
      tags: [assets]
      summary: Upload a font face
      description: |
        Multipart upload. Allowed extensions: `.woff2`, `.ttf`, `.otf` only.
        Storage key: `{businessId}/fonts/{fontId}/original.{ext}`.
        Requires writable subscription (EntitlementGuard). Max size `FONT_MAX_BYTES`.
      operationId: uploadFont
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, family, weight]
              properties:
                file:
                  type: string
                  format: binary
                family:
                  type: string
                  minLength: 1
                  maxLength: 120
                weight:
                  type: integer
                  enum: [100, 200, 300, 400, 500, 600, 700, 800, 900]
                style:
                  type: string
                  enum: [normal, italic]
                  default: normal
      responses:
        '201':
          description: Font face created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicFontFace'
        '400':
          $ref: '#/components/responses/ApiError'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/fonts/{fontId}:
    get:
      tags: [assets]
      summary: Get one font face
      operationId: getFont
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: fontId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Font face
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicFontFace'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      tags: [assets]
      summary: Soft-delete a font face
      operationId: deleteFont
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: fontId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/fonts/{fontId}/file:
    get:
      tags: [assets]
      summary: Stream font binary (for preview / PDF worker)
      description: |
        Returns the original font bytes from ObjectStorage.
        PDF export workers must use the same ObjectStorage adapter — never embed from browser URLs alone.
      operationId: getFontFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: fontId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Font binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            font/woff2:
              schema:
                type: string
                format: binary
            font/ttf:
              schema:
                type: string
                format: binary
            font/otf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/themes:
    get:
      tags: [design]
      summary: List document brand themes
      description: |
        Ensures a default theme exists. Tokens are document/PDF brand tokens —
        not app chrome dark/light (`vdb-theme` cookie).
      operationId: listThemes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Theme list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDesignThemeList'
        '404':
          $ref: '#/components/responses/ApiError'
    post:
      tags: [design]
      summary: Create a document brand theme
      operationId: createTheme
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDesignThemeBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDesignTheme'
        '400':
          $ref: '#/components/responses/ApiError'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
  /businesses/{businessId}/themes/default:
    get:
      tags: [design]
      summary: Get or seed default brand theme
      operationId: getDefaultTheme
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      responses:
        '200':
          description: Default theme
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDesignTheme'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/themes/{themeId}:
    get:
      tags: [design]
      summary: Get one theme
      operationId: getTheme
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: themeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Theme
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDesignTheme'
        '404':
          $ref: '#/components/responses/ApiError'
    patch:
      tags: [design]
      summary: Update theme name and/or tokens
      operationId: updateTheme
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: themeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDesignThemeBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDesignTheme'
        '400':
          $ref: '#/components/responses/ApiError'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      tags: [design]
      summary: Soft-delete a non-default theme
      operationId: deleteTheme
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: themeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '400':
          $ref: '#/components/responses/ApiError'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/themes/{themeId}/default:
    post:
      tags: [design]
      summary: Set theme as Business default
      operationId: setDefaultTheme
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: themeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Now default
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDesignTheme'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/blocks:
    get:
      tags: [design]
      summary: Core block registry
      description: |
        Phase-01 block types from `@vdb/document-schema` (text, image, section,
        divider, headerSlot, footerSlot). Module blocks register later.
      operationId: getBlockRegistry
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      responses:
        '200':
          description: Registry
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicBlockRegistry'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/templates:
    get:
      tags: [design]
      summary: List templates (PostgreSQL metadata)
      operationId: listTemplates
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Template list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDocumentTemplateList'
        '404':
          $ref: '#/components/responses/ApiError'
    post:
      tags: [design]
      summary: Create template (PG + Mongo body)
      description: |
        Metadata in PostgreSQL; body in Mongo `template_bodies` validated by
        TemplateBody schema v2. Default starter blocks if body omitted.
      operationId: createTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentTemplateBody'
      responses:
        '201':
          description: Created with body
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDocumentTemplateDetail'
        '400':
          $ref: '#/components/responses/ApiError'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
  /businesses/{businessId}/templates/{templateId}:
    get:
      tags: [design]
      summary: Get template metadata + Mongo body
      operationId: getTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDocumentTemplateDetail'
        '404':
          $ref: '#/components/responses/ApiError'
    patch:
      tags: [design]
      summary: Update template metadata and/or body
      operationId: updateTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentTemplateBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDocumentTemplateDetail'
        '400':
          $ref: '#/components/responses/ApiError'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      tags: [design]
      summary: Soft-delete template and remove Mongo body
      operationId: deleteTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/documents:
    get:
      tags: [documents]
      summary: List documents (metadata)
      operationId: listDocuments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published]
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDocumentList'
        '404':
          $ref: '#/components/responses/ApiError'
    post:
      tags: [documents]
      summary: Create document from template
      description: |
        Copies template page/blocks into Mongo `document_bodies` (new block ids).
        `dataRefs` starts empty — Business data is not stored in the template.
      operationId: createDocument
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDocumentDetail'
        '400':
          $ref: '#/components/responses/ApiError'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
  /businesses/{businessId}/documents/{documentId}:
    get:
      tags: [documents]
      summary: Get document metadata + Mongo body
      operationId: getDocument
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDocumentDetail'
        '404':
          $ref: '#/components/responses/ApiError'
    patch:
      tags: [documents]
      summary: Update title, status, and/or body
      description: |
        Used by the flow editor autosave (debounced ~800ms). Does not trigger PDF.
      operationId: updateDocument
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDocumentDetail'
        '400':
          $ref: '#/components/responses/ApiError'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      tags: [documents]
      summary: Soft-delete document and remove Mongo body
      operationId: deleteDocument
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/documents/{documentId}/export/pdf:
    post:
      tags: [export]
      summary: Enqueue PDF export
      description: |
        Creates `export_jobs` row (queued) and enqueues BullMQ `export.pdf`.
        Worker renders canonical HTML (masters + theme + embedded fonts) → PDF.
        Never runs on editor keystrokes. Requires entitlement `export.pdf`.
      operationId: createPdfExport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Export job created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicExportJob'
        '402':

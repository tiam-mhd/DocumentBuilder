openapi: 3.0.3
info:
  title: Visual Document Builder API
  version: 0.2.0
  description: |
    Canonical file — keep in sync with Nest routes.
    JWT issuance after OTP verify lands in P01-T02.
servers:
  - url: http://localhost:3001/api
    description: Local development
tags:
  - name: system
    description: Health and public edition config
  - name: auth
    description: Mobile OTP identity
  - name: businesses
    description: Multi-business tenancy
  - name: billing
    description: Subscription status and payments
  - name: content
    description: Business content entities (Projects portfolio, …) — module-gated
  - name: assets
    description: Media library and fonts
  - name: design
    description: Document brand themes (not app chrome dark/light)
  - name: documents
    description: Document instances (PG metadata + Mongo body)
  - name: export
    description: PDF export jobs (BullMQ + ObjectStorage)
  - name: audit
    description: Append-only audit_events list (OWNER/ADMIN)
  - name: backup
    description: Business workspace ZIP backup / restore (OWNER)
  - name: branding
    description: White-label business branding (logo, colors, custom domain, Powered-by)
  - name: members
    description: Business membership and invitations
  - name: web-publish
    description: Public HTML document profiles (ADR 026)
  - name: share-links
    description: Tokenized document share links (ADR 027)
  - name: analytics
    description: Product analytics views/downloads (ADR 028)
  - name: marketplace
    description: SAAS template marketplace catalog + install (ADR 029)
  - name: plugins
    description: First-party plugin manifests (ADR 030) — no user eval
  - name: platform-admin
    description: SAAS platform operator console (ADR 031)
paths:
  /health:
    get:
      tags: [system]
      summary: Liveness + soft dependency checks
      operationId: getHealth
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthReport'
  /system/config:
    get:
      tags: [system]
      summary: Public edition flags (no secrets)
      operationId: getSystemConfig
      responses:
        '200':
          description: Public system config
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicSystemConfig'
  /plugins:
    get:
      tags: [plugins]
      summary: List first-party plugin manifests
      description: |
        Compiled allowlist from `@vdb/plugins`. Both editions.
        Does not load user-uploaded or remote unsigned code (ADR 030).
      operationId: listPlugins
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Plugin catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicPluginList'
        '401':
          $ref: '#/components/responses/ApiError'
  /platform-admin/me:
    get:
      tags: [platform-admin]
      summary: Am I a SAAS platform admin?
      operationId: getPlatformAdminMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Me
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicPlatformAdminMe'
  /platform-admin/users:
    get:
      tags: [platform-admin]
      summary: List users (minimal fields)
      operationId: listPlatformAdminUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicPlatformAdminUserList'
        '403':
          $ref: '#/components/responses/ApiError'
  /platform-admin/businesses:
    get:
      tags: [platform-admin]
      summary: List businesses
      operationId: listPlatformAdminBusinesses
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: q
          in: query
          schema: { type: string }
        - name: suspended
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated businesses
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicPlatformAdminBusinessList'
        '403':
          $ref: '#/components/responses/ApiError'
  /platform-admin/businesses/{businessId}/suspend:
    post:
      tags: [platform-admin]
      summary: Suspend a Business
      operationId: suspendPlatformBusiness
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Suspended business
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /platform-admin/businesses/{businessId}/unsuspend:
    post:
      tags: [platform-admin]
      summary: Unsuspend a Business
      operationId: unsuspendPlatformBusiness
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Active business
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /platform-admin/subscriptions:
    get:
      tags: [platform-admin]
      summary: List subscriptions
      operationId: listPlatformAdminSubscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated subscriptions
        '403':
          $ref: '#/components/responses/ApiError'
  /platform-admin/jobs/failed:
    get:
      tags: [platform-admin]
      summary: List failed export jobs
      operationId: listPlatformAdminFailedJobs
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Failed jobs
        '403':
          $ref: '#/components/responses/ApiError'
  /platform-admin/dunning/run:
    post:
      tags: [platform-admin]
      summary: Run billing dunning tick (optional fake clock)
      description: |
        SAAS platform admin only. Persists grace/expired and sends idempotent SMS.
        Optional body `nowIso` for tests. See ADR 032.
      operationId: runPlatformDunning
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nowIso:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Tick summary
        '403':
          $ref: '#/components/responses/ApiError'
  /system/license:
    get:
      tags: [system]
      summary: Installation license status (no secrets)
      operationId: getInstallationLicense
      responses:
        '200':
          description: License status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicInstallationLicense'
  /system/license/activate:
    post:
      tags: [system]
      summary: Activate SELF_HOSTED installation license
      operationId: activateInstallationLicense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateLicenseBody'
      responses:
        '200':
          description: Activated status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicInstallationLicense'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/audit-events:
    get:
      tags: [audit]
      summary: List audit events (OWNER/ADMIN; tenant-scoped)
      operationId: listAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: action
          in: query
          schema:
            type: string
            maxLength: 120
          description: Exact action code (e.g. export.pdf.enqueued)
        - name: entityType
          in: query
          schema:
            type: string
            maxLength: 80
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on createdAt
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Inclusive upper bound on createdAt
      responses:
        '200':
          description: Paginated audit events for this business (plus member login / install license)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicAuditEventList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/backups:
    post:
      tags: [backup]
      summary: Enqueue workspace ZIP backup (OWNER + writable)
      operationId: createWorkspaceBackup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      responses:
        '200':
          description: Backup job queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicWorkspaceBackupJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiError'
    get:
      tags: [backup]
      summary: List workspace backup jobs (OWNER)
      operationId: listWorkspaceBackups
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated backup jobs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items, total, page, pageSize]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicWorkspaceBackupJob'
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
  /businesses/{businessId}/backups/{jobId}:
    get:
      tags: [backup]
      summary: Get backup job (OWNER)
      operationId: getWorkspaceBackup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Backup job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicWorkspaceBackupJob'
  /businesses/{businessId}/backups/{jobId}/file:
    get:
      tags: [backup]
      summary: Download completed backup ZIP (OWNER)
      operationId: downloadWorkspaceBackup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: application/zip
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '409':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/restores/upload:
    post:
      tags: [backup]
      summary: Upload ZIP for restore preview (OWNER)
      operationId: uploadWorkspaceRestore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Restore job in uploaded/preview state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicWorkspaceRestoreJob'
        '400':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/restores/{jobId}:
    get:
      tags: [backup]
      summary: Get restore job / preview (OWNER)
      operationId: getWorkspaceRestore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Restore job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicWorkspaceRestoreJob'
  /businesses/{businessId}/restores/{jobId}/commit:
    post:
      tags: [backup]
      summary: Commit restore after preview (OWNER)
      operationId: commitWorkspaceRestore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmReplace:
                  type: boolean
                  description: Required when target workspace is not empty
      responses:
        '200':
          description: Restore queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicWorkspaceRestoreJob'
        '409':
          description: Target not empty without confirmReplace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /businesses/{businessId}/media:
    get:
      tags: [assets]
      summary: List media assets
      operationId: listMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 24
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicMediaList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /businesses/{businessId}/media/upload:
    post:
      tags: [assets]
      summary: Upload image (writable + EntitlementGuard)
      operationId: uploadMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Created asset
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicMediaAsset'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
  /businesses/{businessId}/media/{assetId}:
    get:
      tags: [assets]
      summary: Get media metadata
      operationId: getMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicMediaAsset'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      tags: [assets]
      summary: Soft-delete media
      operationId: deleteMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/media/{assetId}/file:
    get:
      tags: [assets]
      summary: Stream media variant
      operationId: getMediaFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: variant
          in: query
          schema:
            type: string
            enum: [original, thumb, web, print]
            default: original
      responses:
        '200':
          description: Binary image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/fonts:
    get:
      tags: [assets]
      summary: List font faces for a business
      description: |
        Paginated list of uploaded font faces (family/weight/style).
        Use for theme/template pickers. Soft-deleted faces are omitted.
      operationId: listFonts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: q
          in: query
          description: Search family or original filename
          schema:
            type: string
      responses:
        '200':
          description: Font list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicFontList'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/fonts/upload:
    post:
      tags: [assets]
      summary: Upload a font face
      description: |
        Multipart upload. Allowed extensions: `.woff2`, `.ttf`, `.otf` only.
        Storage key: `{businessId}/fonts/{fontId}/original.{ext}`.
        Requires writable subscription (EntitlementGuard). Max size `FONT_MAX_BYTES`.
      operationId: uploadFont
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, family, weight]
              properties:
                file:
                  type: string
                  format: binary
                family:
                  type: string
                  minLength: 1
                  maxLength: 120
                weight:
                  type: integer
                  enum: [100, 200, 300, 400, 500, 600, 700, 800, 900]
                style:
                  type: string
                  enum: [normal, italic]
                  default: normal
      responses:
        '201':
          description: Font face created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicFontFace'
        '400':
          $ref: '#/components/responses/ApiError'
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/fonts/{fontId}:
    get:
      tags: [assets]
      summary: Get one font face
      operationId: getFont
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: fontId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Font face
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicFontFace'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      tags: [assets]
      summary: Soft-delete a font face
      operationId: deleteFont
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: fontId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '402':
          $ref: '#/components/responses/EntitlementDenied'
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/fonts/{fontId}/file:
    get:
      tags: [assets]
      summary: Stream font binary (for preview / PDF worker)
      description: |
        Returns the original font bytes from ObjectStorage.
        PDF export workers must use the same ObjectStorage adapter — never embed from browser URLs alone.
      operationId: getFontFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: fontId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Font binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            font/woff2:
              schema:
                type: string
                format: binary
            font/ttf:
              schema:
                type: string
                format: binary
            font/otf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ApiError'
  /businesses/{businessId}/themes:
    get:
      tags: [design]
      summary: List document brand themes
      description: |
        Ensures a default theme exists. Tokens are document/PDF brand tokens —
        not app chrome dark/light (`vdb-theme` cookie).
      operationId: listThemes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Theme list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicDesignThemeList'
        '404':
          $ref: '#/components/responses/ApiError'
    post:
      tags: [design]
      summary: Create a document brand theme
      operationId: createTheme
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
